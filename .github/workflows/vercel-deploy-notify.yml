name: Vercel Deploy Notify

on:
  check_suite:
    types: [completed]
  workflow_dispatch:

jobs:
  notify:
    if: github.event.check_suite.app.name == 'Vercel' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Discord Success
        if: github.event.check_suite.conclusion == 'success' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Vercel 部署成功",
                "description": "**Repository:** EndlessPixel/server\n**Branch:** `${{ github.event.check_suite.head_branch }}`\n**Commit:** `${{ github.event.check_suite.head_sha }}`\n**Time:** '"$(date -u +%Y-%m-%d\ %H:%M:%S)"' UTC",
                "color": 2087293,
                "author": {
                  "name": "GitHub Actions",
                  "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              }]
            }'

      - name: Discord Failure
        if: github.event.check_suite.conclusion == 'failure'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Vercel 部署失败",
                "description": "**Repository:** EndlessPixel/server\n**Branch:** `${{ github.event.check_suite.head_branch }}`\n**Commit:** `${{ github.event.check_suite.head_sha }}`\n**Time:** '"$(date -u +%Y-%m-%d\ %H:%M:%S)"' UTC",
                "color": 13631406,
                "author": {
                  "name": "GitHub Actions",
                  "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              }]
            }'