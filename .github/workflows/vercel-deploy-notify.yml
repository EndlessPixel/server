name: Vercel Deploy Notify

on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.failed]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Success
        if: github.event.action == 'vercel.deployment.success' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ 部署成功",
                "description": "**${{ github.repository }}**\nVercel 部署已完成并上线",
                "url": "https://vercel.com/${{ github.repository }}",
                "color": 5763719,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
                "thumbnail": { "url": "https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/vercel.png" }
              }]
            }'

      - name: Discord Failure
        if: github.event.action == 'vercel.deployment.failed'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ 部署失败",
                "description": "**${{ github.repository }}**\nVercel 部署出错，请检查构建日志",
                "url": "https://github.com/${{ github.repository }}/actions",
                "color": 15548997,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
                "thumbnail": { "url": "https://raw.githubusercontent.com/lobehub/lobe-icons/refs/heads/master/packages/static-png/dark/vercel.png" }
              }]
            }'
