name: Vercel Deploy Notify

on:
  repository_dispatch:
    types: [vercel.deployment.success, vercel.deployment.failed]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Discord Success
        if: github.event.action == 'vercel.deployment.success' || github.event_name == 'workflow_dispatch'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Vercel 部署成功",
                "description": "**Repository:** ${{ github.repository }}\n**Branch:** `${{ github.ref_name }}`\n**Commit:** `${{ github.sha }}`\n**Time:** '"$(date -u +%Y-%m-%d\ %H:%M:%S)"' UTC",
                "color": 2087293,
                "author": {
                  "name": "GitHub Actions",
                  "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              }]
            }'

      - name: Discord Failure
        if: github.event.action == 'vercel.deployment.failed'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "Vercel 部署失败",
                "description": "**Repository:** ${{ github.repository }}\n**Branch:** `${{ github.ref_name }}`\n**Commit:** `${{ github.sha }}`\n**Time:** '"$(date -u +%Y-%m-%d\ %H:%M:%S)"' UTC",
                "color": 13631406,
                "author": {
                  "name": "GitHub Actions",
                  "icon_url": "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                }
              }]
            }'
