name: Vercel Deploy Notify

on:
  check_suite:
    types: [completed]

jobs:
  notify:
    if: >
      github.event.check_suite.app.name == 'Vercel' &&
      github.event.check_suite.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Discord Success
        if: github.event.check_suite.conclusion == 'success'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "✅ 部署成功",
                "description": "**${{ github.repository }}**\nVercel 部署已完成并上线",
                "url": "https://vercel.com/${{ github.repository }}",
                "color": 5763719,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'

      - name: Discord Failure
        if: github.event.check_suite.conclusion == 'failure'
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ 部署失败",
                "description": "**${{ github.repository }}**\nVercel 部署出错，请检查构建日志",
                "url": "https://github.com/${{ github.repository }}/actions",
                "color": 15548997,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }'
